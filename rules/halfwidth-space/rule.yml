id: halfwidth-space
category: 修正
domain: common
detector: static
subject:
- sentence
- list-item
- heading
match:
  regex: ([ぁ-んァ-ヶ一-龥])\s+([a-zA-Z0-9_-]{2,})\s+([ぁ-ん])
  strip:
  - inline-code
  skip: リンク記法を含む行
  from: yomiyasu_lint.py unnatural_halfwidth_space
basis:
- source: yomiyasu/references/gemini-syntax.md
  text: 英語の単語区切り感覚を引きずり、英単語やアルファベットの前後に不要な半角空白を空けるクセを禁止する。
- source: yomiyasu/references/gemini-syntax.md
  text: 日本語の助詞や平仮名とアルファベットの間は空白を空けず自然に接続させる。
