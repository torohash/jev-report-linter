id: pseudo-evaluation
category: 修正
source: yomiyasu/references/slop-catalog.md 5章「評価を装う語」
detector: jev
subject:
- sentence
- list-item
match:
  regex: 本質|地に足のついた|等身大
state: bare
kind: noul
threshold: 0.6  # 該当例なし（仮）
ask: The matched word is an empty modifier that fakes an evaluation.
criteria:
  'true': The word (本質的, 地に足のついた, 等身大) decorates another word and could be deleted without losing meaning.
  'false': The word is the topic or the point of the sentence itself, as in "the essence of X is Y".
instruction: 空疎な修飾語は削る。論点を「目的」など別の概念にすり替えない。動詞を足して文の働きを変えない。
