id: surge-evaluation-noun
category: 修正
source: yomiyasu/references/slop-catalog.md 3章「評価・結論の定型」、SKILL.md Step 3
detector: jev
subject:
- sentence
- list-item
match:
  regex: 既定|別物|定番|要点|定石|桁違い
state: bare
kind: noul
threshold: 0.6  # 該当例なし（仮）
ask: The matched word is used as a stock evaluative phrase.
criteria:
  'true': The word (既定, 別物, 定番, 要点, 定石, 桁違い) delivers a ready-made verdict in place of a plain description.
  'false': The word is a legitimate technical term or a plain statement of fact, such as a default value or a default branch.
instruction: ふだん使う平易な言葉に開く。既定→もともとの設定、別物→まったく違うもの、定番→よく使われるもの、要点→大事なところ、定石→標準の進め方、桁違い→はるかに大きい。
