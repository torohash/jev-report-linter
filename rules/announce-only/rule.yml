id: announce-only
category: 修正
source: yomiyasu/SKILL.md「段落と文の論理構造」2、references/gemini-syntax.md 原則13
detector: jev
subject:
- sentence
state: located
kind: noul
threshold: null  # 分離不可（無効）
ask: This sentence only announces that content will follow and carries no content of its own.
criteria:
  'true': The sentence is a bare signpost ("以下にまとめます", "注目すべき点があります", "理由は以下の通りです").
  'false': The sentence states a fact, a count with its subject ("変更したファイルは次の2つです"), a result, or a judgment.
note: A heading or a label is not a sentence and is never this defect.
instruction: 予告が担っていた重みを述語に残して、続く中身の文と1文にまとめる。まとめると意味が変わる場合は残す。
