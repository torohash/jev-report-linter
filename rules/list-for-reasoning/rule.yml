id: list-for-reasoning
category: 修正
source: yomiyasu/references/domains/tech.md 1章、scripts/yomiyasu_lint.py excess_list
detector: jev
subject:
- list-item
state: located
kind: noul
threshold: null  # 分離不可（無効）
ask: This list item carries a step of reasoning that depends on the neighbouring items.
criteria:
  'true': The item continues an argument across items, with a connective such as "そのため" or "その場合は" that only makes sense after the previous item.
  'false': The item is one of several parallel entries (files, checks, findings, options), even if it contains its own reason.
instruction: 思考の流れや論理展開は地の文の段落で書く。元にない評価や義務を足さない。地の文にすると同じ文末が3つ以上続くときは、箇条書きのまま残す。
