id: grandiose
category: 修正
source: yomiyasu/references/slop-catalog.md 4章、references/domains/essay.md 1章
detector: jev
subject:
- sentence
- list-item
match:
  regex: 真理|真実|結末|宿命|運命|境地|極致|究極|虚飾|虚像|美学|深淵|禁欲的|優美|冷徹|残酷|凝縮|結晶
state: bare
kind: noul
threshold: 0.6  # 該当例なし（仮）
ask: The matched word inflates a small experience or an everyday technical decision into something grand.
criteria:
  'true': A heavy word (真理, 宿命, 境地, 美学, 深淵, 結晶 and the like) is applied to ordinary work or a routine judgment.
  'false': The word is literal or proportionate to what it describes.
instruction: 重い熟語を削り、元の文にある内容を平易な言葉で表す。元にない架空の固有名詞や普遍の教訓を足さない。
