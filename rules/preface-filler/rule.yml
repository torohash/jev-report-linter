id: preface-filler
category: 修正
domain: common
detector: jev
subject:
- sentence
- list-item
match:
  regex_any:
  - ^(まず|ここで)?重要なのは、?
  - ^結論から言うと、?
  - ^正直に言うと、?
  - ^避けたいのは、?
  - ここで注目すべきは
  from: yomiyasu_lint.py FILLER_PATTERNS と出典の列挙
quote:
- source: yomiyasu/references/slop-catalog.md
  text: 単なる前置きは削り、要点の主文から書き始める。ただし「何が大事か」という評価そのものを担っている場合は、述語に移して残す（「〜が大事です」）。
