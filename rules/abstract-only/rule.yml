id: abstract-only
category: 修正
source: yomiyasu/references/domains/tech.md 2章
detector: jev
subject:
- sentence
state: located
kind: noul
threshold: 0.6  # 該当例なし（仮）
ask: This sentence describes the work only in abstract qualities, and neither it nor the sentences around it give the concrete change.
criteria:
  'true': The sentence characterises the result with abstract qualities ("柔軟で拡張性の高い構成にしました") and the report nowhere near it says what was actually changed.
  'false': The sentence names a file, a function, a value, a step, or a finding, or it is a summary whose details are given in the surrounding sentences. An overall verdict of a review is not this defect.
instruction: 元の文や前後の資料にある情報の範囲で、手順や設定を整理して書く。元にないコマンドやコード片を作らない。
