id: personification
category: 修正
source: yomiyasu/SKILL.md「擬人化の解消」、references/gemini-syntax.md 原則3
detector: jev
subject:
- sentence
- list-item
state: bare
kind: noul
threshold: 0.6  # 該当例なし（仮）
ask: This sentence gives a tool, code, or concept feelings or a will.
criteria:
  'true': A non-living subject speaks, wishes, tells a story, proves itself, or invites something ("コードが語る", "ログが物語っています").
  'false': The sentence states objectively what a tool or mechanism does ("このツールはログを集めます").
instruction: 客観的な事実として書き直す。元にない条件（〜を使えば）や可能（〜できます）を足さない。
