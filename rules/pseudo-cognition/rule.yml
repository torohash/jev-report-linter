id: pseudo-cognition
category: 修正
source: yomiyasu/references/slop-catalog.md 5章「認知を装う語」
detector: jev
subject:
- sentence
- list-item
match:
  regex: 解像度|腹落ち|メンタルモデル|文脈
state: bare
kind: noul
threshold: 0.22  # 隙間の中点
ask: The matched word fakes understanding instead of saying what was examined.
criteria:
  'true': The word (解像度を上げる, 腹落ち, メンタルモデル, 文脈) claims depth of understanding without saying what was looked at or how far.
  'false': The word is literal or technical, such as screen resolution, or 文脈 meaning the surrounding text or an execution context.
instruction: 何をどこまで調べたのかを、元の文にある情報の範囲で客観的に書く。
