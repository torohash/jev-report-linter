id: surge-role-metaphor
category: 修正
source: yomiyasu/references/slop-catalog.md 3章「役割・位置の比喩」、SKILL.md Step 3
detector: jev
subject:
- sentence
- list-item
match:
  regex: 入口|土台|道具|核心|主役|構図|線引き
state: bare
kind: noul
threshold: 0.6  # 該当例なし（仮）
ask: The matched word is used as a metaphor for a role or a position.
criteria:
  'true': The word (入口, 土台, 道具, 核心, 主役, 構図, 線引き) figuratively names a starting point, a basis, a means, or a boundary.
  'false': The word is a legitimate technical term or is literal, such as the entry point of a function.
instruction: ふだん使う平易な言葉に開く。入口→手始め、土台→基本、道具→手段、核心→いちばん肝心なところ、主役→中心、構図→全体の仕組み、線引き→区切り。
