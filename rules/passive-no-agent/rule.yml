id: passive-no-agent
category: 修正
source: yomiyasu/references/domains/business.md 2章「主語の明確化」
detector: jev
subject:
- sentence
- list-item
match:
  regex: (さ|ら)?れ(る|た|ます|ました|ており|ている|ています)
state: located
kind: noul
threshold: 0.9  # 該当例なし（仮）
ask: The passive voice in this sentence hides who is responsible for a decision or an action.
criteria:
  'true': A decision, judgment, or action by a person or team is stated in the passive, and neither the sentence nor the surrounding report says who did it ("対応が必要と判断されました").
  'false': The passive describes what a program, a tool, or a process does, or the actor is evident from the sentence or the sentences around it.
note: Passives about software behaviour ("the value is cached", "the test is skipped") are not hidden responsibility.
instruction: 元の文や前後から主体が特定できる場合に限り、責任主体を明記する。特定できない場合は架空の人物や役職を作らず、客観的な事実として書く。
