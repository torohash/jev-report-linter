id: stock-closing
category: 削除
source: yomiyasu/references/slop-catalog.md 6章「定型クロージング」、references/domains/essay.md 3章、scripts/yomiyasu_lint.py FILLER_PATTERNS
detector: static
subject:
- sentence
- list-item
match:
