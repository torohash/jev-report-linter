id: negative-parallelism
category: 修正
source: yomiyasu/references/slop-catalog.md 2章、SKILL.md「セルフラベリングと否定対比の整理」、references/gemini-syntax.md 原則5
detector: jev
subject:
- sentence
- list-item
match:
  regex: ではなく|ではなくて|じゃなく
state: bare
kind: noul
threshold: 0.6  # 該当例なし（仮）
ask: The "not A but B" contrast in this sentence is purely rhetorical.
criteria:
  'true': A is a strawman nobody would assume ("this is not a mere fix but a redesign"); dropping "not A" leaves the claim about B unchanged.
  'false': A is something a reader could plausibly believe or a real alternative, so the negation corrects a misunderstanding or switches a policy ("the unit is milliseconds, not seconds").
instruction: 肯定文にする。否定していたAを「Aに加えてB」と並べたり、「AよりB」と順位づけしたりしない。「そのもの」などの強調語を足さない。
