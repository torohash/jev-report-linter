id: subject-predicate-mismatch
category: 修正
source: yomiyasu/SKILL.md「段落と文の論理構造」4、references/gemini-syntax.md 原則13
detector: jev
subject:
- sentence
state: bare
kind: noul
threshold: null  # 分離不可（無効）
ask: The subject and the predicate of this sentence do not fit together grammatically.
criteria:
  'true': The sentence starts one construction and ends another, as in "この修正の目的は、応答時間が短くなります".
  'false': The subject and the predicate agree.
instruction: 元の文の意図が読み取れる範囲で、主語と述語を対応させる。
