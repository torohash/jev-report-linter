id: redundant-paren
category: 修正
domain: common
detector: jev
subject:
- sentence
- list-item
match:
  regex: '[（(][^）)]+[）)]'
applies:
- source: yomiyasu/references/gemini-syntax.md
  text: 情報量が増えない言い換えや同義語の補足カッコ
basis:
- source: yomiyasu/references/gemini-syntax.md
  text: 情報量が増えない言い換えや同義語の補足カッコを全廃する。
- source: yomiyasu/references/gemini-syntax.md
  text: 必要な情報は地の文に直接組み込み、意味の重複する注釈カッコを削る方針をとる。
