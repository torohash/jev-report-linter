id: unconfirmed
category: 調査
source: README.md「分類」
detector: jev
subject:
- sentence
- list-item
state: bare
kind: noul
threshold: 0.81  # 分離不可（F1最大）
ask: This sentence says that something has not been confirmed or is not settled.
criteria:
  'true': The sentence states that a check, test, or run was not done ("未確認", "実行していません", "確認できていません"), that something is undecided ("未定", "要確認"), or presents a fact as a guess ("〜はずです", "〜かもしれません", "〜の可能性があります", "おそらく").
  'false': The sentence states what was done or found as fact, or asks the reader to do something without saying the writer left it unchecked.
instruction: 確定状態に持っていけるように調査する。
