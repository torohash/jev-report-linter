id: metaphor-verb
category: 修正
domain: common
detector: jev
subject:
- sentence
- list-item
match:
  regex_any:
  - (地味に|よく|じわじわ)効[かきくけいた]
  - (データ|仕様|設計|環境|ビルド|システム|秩序)が(静かに)?壊れ
  - 静かに(壊れ|落ち|失敗|沈黙)
  - 黙って(無視|捨て|スキップ|破棄)
  - 側に倒[すしせ]
  - 時間[をに]溶か[したす]
  - (1つずつ|一つずつ)潰[していく]
  - (実装|詳細|コード|設計|内部|仕組み|領域|本質)(に|まで|へ)踏み込[んむみま]
  - 動かしながら引き返[すし]
  - 代わりに添え[るた]
  - (議論|意見|結論|方向性|価格|話題|検討)が[^。！？!?]*?収斂
  - した瞬間に?
  - (前提|基盤)が崩れ[るた]
  - 文化が醸成
  - プロセスが定着
  - 事例が残した
  from: yomiyasu_lint.py METAPHOR_VERB_PATTERNS
quote:
- source: yomiyasu/references/slop-catalog.md
  text: 抽象的な事象や技術操作を、安易な比喩動詞で言い換える傾向を解体する。
- source: yomiyasu/scripts/yomiyasu_lint.py
  text: 不自然な比喩動詞であれば、ふだん使う動詞や客観的な表現に書き直してください。ただし、文字どおりの動作や状態変化を表している場合は無理に言い換える必要はありません。
