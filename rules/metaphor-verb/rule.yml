id: metaphor-verb
category: 修正
source: yomiyasu/references/slop-catalog.md 1章、SKILL.md「比喩動詞の具体化」、references/gemini-syntax.md 原則4、references/domains/business.md 1章
detector: jev
subject:
- sentence
- list-item
match:
  regex: 効[かきくけい]|壊[れすし]|倒[すしせ]|溶か|潰[すし]|踏み込|引き返|添え|収斂|沈黙|黙って|崩れ|配[るり]
state: bare
kind: noul
threshold: 0.64  # 分離不可（F1最大）
ask: The matched verb is used as a metaphor for a technical operation or an abstract matter.
criteria:
  'true': The verb (such as 倒す, 効く, 溶かす, 潰す, 踏み込む, 壊れる, 崩れる, 黙って) describes something that does not literally do that action, for example a decision "leaning to the safe side" or data "breaking".
  'false': The verb is literal (a physical object breaks, a setting takes effect in the sense of becoming effective), or it is an idiom long established in everyday Japanese.
note: Judge only the matched verb. 効く meaning "is effective / takes effect" is literal.
instruction: 比喩の動詞を、ふだん使う言葉や文脈に合った言葉に置き換える。難解な技術用語や硬い漢語に寄せない。比喩が持っていた含みは残す。
