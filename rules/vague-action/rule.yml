id: vague-action
category: 修正
source: yomiyasu/references/domains/business.md 2章「条件と結果の1対1対応」
detector: jev
subject:
- sentence
- list-item
state: bare
kind: noul
threshold: null  # 分離不可（無効）
ask: This sentence describes an action taken or to be taken in terms too vague to act on.
criteria:
  'true': The action is stated without saying what it is ("適宜対応する", "必要に応じて調整しました").
  'false': The sentence says what was done or should be done, to what.
instruction: 元の資料に具体的な条件がある場合に限り、具体化する。資料にない条件や数値を作らない。
